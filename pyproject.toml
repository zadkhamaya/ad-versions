[project]
name = "ad-versions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0", "pyyaml==6.0.2", "boto3==1.35.90", "faster-whisper==1.1.1", "numpy==2.2.1",
                "huggingface_hub==0.27.1", "av==14.2.0"]  # faster-whisper 1.1.1 imports requests (hub 1.x+ dropped it) and passes av.open(metadata_errors=) (av 19 rejects it; 14.2.0 checked)
[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]
[tool.setuptools]
packages = ["media"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [   # two third-party deprecations only (botocore's utcnow, starlette's anyio alias); ours still show
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore.auth",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
